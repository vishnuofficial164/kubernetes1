apiVersion: v1
kind: Pod
metadata:
  name: testpod1
spec:
  restartPolicy: Always
  containers:
  - name: container1
    image: busybox
    command: ['sh', '-c', 'sleep 10'] 

  
apiVersion: v1
kind: Pod
metadata:
  name: testpod1
spec:
  restartPolicy: OnFailure
  containers:
  - name: container1
    image: busybox
    command: ["sh", "-c", "sleep 5; echo 'Container is about to fail'; exit 1"] 

    apiVersion: v1
kind: Pod
metadata:
  name: testpod1
spec:
  restartPolicy: Never
  containers:
  - name: container1
    image: busybox
    command: ["sh", "-c", "echo 'This container will run only once.'; sleep 5"]
